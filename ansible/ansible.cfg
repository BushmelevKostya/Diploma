[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
remote_user = ubuntu

[ssh_connection]
# ProxyJump + ControlMaster в некоторых сессиях рвут канал (Shared connection closed)
ssh_args = -o ControlMaster=no -o ControlPersist=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10
pipelining = False
retries = 3
