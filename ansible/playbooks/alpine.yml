---
- name: Bootstrap Alpine VM
  hosts: all
  gather_facts: false
  become: true
  # Alpine cloud images may have doas but not sudo until cloud-final finishes; doas.d is written by cloud-init.
  become_method: doas
  vars:
    selected_environment_packages: "{{ environment_packages | default([]) }}"

  pre_tasks:
    - name: Wait for SSH command execution to be ready
      ansible.builtin.raw: /bin/sh -c 'echo ssh-ready'
      register: ssh_ready
      changed_when: false
      failed_when: false
      retries: 45
      delay: 2
      until: ssh_ready.rc == 0
      become: false

    # Cloud-init may finish openssh/python3 before sudo; doas + /etc/doas.d/99-diploma.conf is applied earlier.
    - name: Wait until doas or sudo is available
      ansible.builtin.raw: /bin/sh -c 'test -x /usr/bin/doas || test -x /usr/bin/sudo'
      register: priv_esc_check
      changed_when: false
      retries: 90
      delay: 2
      until: priv_esc_check.rc == 0
      become: false

    # Never use bare `cloud-init status --wait`: it blocks until "done" and can hang forever if a stage stalls.
    # BusyBox `timeout` caps the wait; apk task below still retries if the DB lock remains.
    - name: Bounded wait for cloud-init before apk
      ansible.builtin.raw: /bin/sh -c 'if test -x /usr/bin/cloud-init && test -x /usr/bin/timeout; then timeout 180 /usr/bin/cloud-init status --wait || true; fi'
      changed_when: false
      failed_when: false
      become: false

  tasks:

    - name: Ensure base packages are installed
      community.general.apk:
        name:
          - bash
          - curl
          - ca-certificates
          - python3
          - sudo
          - doas
        update_cache: true
        state: present
      register: apk_base
      retries: 30
      delay: 5
      until: apk_base is success

    - name: Gather facts
      ansible.builtin.setup:

    - name: Ensure SSH server is installed and running
      community.general.apk:
        name: openssh
        state: present
      when: "'SSH' in selected_environment_packages or 'HTTP_SERVER' in selected_environment_packages"

    - name: Enable SSH service at boot
      ansible.builtin.command: rc-update add sshd default
      register: rc_add_sshd
      changed_when: "'added' in rc_add_sshd.stdout"
      failed_when: rc_add_sshd.rc != 0 and 'already' not in rc_add_sshd.stderr

    - name: Start SSH service
      ansible.builtin.command: rc-service sshd start
      register: rc_start_sshd
      changed_when: "'started' in rc_start_sshd.stdout"
      failed_when: rc_start_sshd.rc != 0 and 'started' not in rc_start_sshd.stdout

    - name: Create directory for HTTP demo content
      ansible.builtin.file:
        path: /var/www/diploma-empty
        state: directory
        owner: alpine
        group: alpine
        mode: "0755"
      when: "'HTTP_SERVER' in selected_environment_packages"

    - name: Render HTTP demo index page
      ansible.builtin.copy:
        dest: /var/www/diploma-empty/index.html
        owner: alpine
        group: alpine
        mode: "0644"
        content: |
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>{{ ansible_hostname }}</title>
            <style>
              body { font-family: monospace; background:#0b1217; color:#d7e3ea;
                     display:flex; align-items:center; justify-content:center;
                     height:100vh; margin:0; }
              .card { text-align:center; }
              .host { font-size: 3rem; font-weight: 700; color:#9fd2ce; }
              .ip   { font-size: 1.5rem; margin-top: .5rem; }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="host">{{ ansible_hostname }}</div>
              <div class="ip">{{ ansible_default_ipv4.address }}</div>
            </div>
          </body>
          </html>
      when: "'HTTP_SERVER' in selected_environment_packages"

    - name: Install HTTP demo launcher
      ansible.builtin.copy:
        dest: /usr/local/bin/diploma-http-demo
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          PORT="$${1:-8080}"
          cd /var/www/diploma-empty
          exec /usr/bin/python3 -m http.server "$${PORT}" --bind 0.0.0.0
      when: "'HTTP_SERVER' in selected_environment_packages"

    - name: Install OpenRC service for HTTP demo
      ansible.builtin.copy:
        dest: /etc/init.d/diploma-http-demo
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/sbin/openrc-run
          name="diploma-http-demo"
          description="Diploma HTTP demo (returns hostname/ip)"
          supervisor="supervise-daemon"
          command="/usr/bin/python3"
          command_args="-m http.server 8080 --bind 0.0.0.0"
          command_user="alpine"
          directory="/var/www/diploma-empty"
          pidfile="/run/diploma-http-demo.pid"
          depend() {
              need net
              after firewall
          }
      when: "'HTTP_SERVER' in selected_environment_packages"

    - name: Enable HTTP demo at boot
      ansible.builtin.command: rc-update add diploma-http-demo default
      when: "'HTTP_SERVER' in selected_environment_packages"
      register: rc_add_http
      changed_when: "'added' in rc_add_http.stdout"
      failed_when: rc_add_http.rc != 0 and 'already' not in rc_add_http.stderr

    # restart: start is a no-op when OpenRC thinks the service is already up (e.g. stale pid), leaving nothing on 8080
    - name: Restart HTTP demo service
      ansible.builtin.command: rc-service diploma-http-demo restart
      when: "'HTTP_SERVER' in selected_environment_packages"
      register: rc_restart_http
      changed_when: true
      failed_when: rc_restart_http.rc != 0

    - name: Wait for HTTP demo to listen on guest
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        timeout: 45
      when: "'HTTP_SERVER' in selected_environment_packages"
