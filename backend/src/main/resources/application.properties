spring.application.name=backend
server.port=8080

spring.datasource.url=${BACKEND_DB_URL:jdbc:postgresql://localhost:5433/diploma}
spring.datasource.username=${BACKEND_DB_USER:postgres}
spring.datasource.password=${BACKEND_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.jdbc.url=${spring.datasource.url}
spring.jpa.properties.jakarta.persistence.jdbc.user=${spring.datasource.username}
spring.jpa.properties.jakarta.persistence.jdbc.password=${spring.datasource.password}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

auth.jwt.secret=${AUTH_JWT_SECRET:change-this-secret-key-for-dev-only-32-bytes}
auth.jwt.access-expiration-seconds=${AUTH_JWT_ACCESS_EXPIRATION_SECONDS:3600}
auth.jwt.refresh-expiration-seconds=${AUTH_JWT_REFRESH_EXPIRATION_SECONDS:604800}

infra.enabled=${INFRA_ENABLED:true}
infra.use-wsl=${INFRA_USE_WSL:true}
infra.repo-root=${INFRA_REPO_ROOT:C:/Projects/Diploma}
infra.wsl-repo-root=${INFRA_WSL_REPO_ROOT:/mnt/c/Projects/Diploma}
infra.virtualization-host=${INFRA_VIRTUALIZATION_HOST:89.104.68.81}
infra.virtualization-user=${INFRA_VIRTUALIZATION_USER:root}
infra.virtualization-private-key-path=${INFRA_VIRTUALIZATION_PRIVATE_KEY_PATH:C:/Users/kosti/.ssh/id_rsa}
infra.vm-ssh-user=${INFRA_VM_SSH_USER:ubuntu}
infra.ansible-private-key-path=C:/Projects/Diploma/backend/id_rsa_vm_pem
infra.tofu-command=${INFRA_TOFU_COMMAND:tofu}
infra.ansible-playbook-command=${INFRA_ANSIBLE_PLAYBOOK_COMMAND:ansible-playbook}
infra.ip-wait-timeout-seconds=${INFRA_IP_WAIT_TIMEOUT_SECONDS:900}
infra.ip-poll-interval-seconds=${INFRA_IP_POLL_INTERVAL_SECONDS:5}
infra.command-timeout-seconds=${INFRA_COMMAND_TIMEOUT_SECONDS:900}
infra.command-progress-log-interval-seconds=${INFRA_COMMAND_PROGRESS_LOG_INTERVAL_SECONDS:15}

# OS-specific defaults for tofu/ansible per osImage
# OS-specific defaults for tofu/ansible per osImage
infra.os-defaults.ubuntu_22_04.ssh-user=ubuntu
infra.os-defaults.ubuntu_22_04.playbook=base.yml
infra.os-defaults.ubuntu_22_04.base-image-path=/var/lib/libvirt/images/ubuntu-base.qcow2
infra.os-defaults.ubuntu_22_04.python-interpreter=auto_silent

infra.os-defaults.alpine_3_19.ssh-user=alpine
infra.os-defaults.alpine_3_19.playbook=alpine.yml
infra.os-defaults.alpine_3_19.base-image-path=/var/lib/libvirt/images/alpine-base.qcow2
infra.os-defaults.alpine_3_19.python-interpreter=/usr/bin/python3
