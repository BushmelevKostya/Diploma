openapi: 3.0.3
info:
  title: Infrastructure Management API
  description: API для управления виртуальными машинами, деплоями, снапшотами, мониторингом и drift-отчётами
  version: 1.0.0
  contact:
    name: Kostik Bushmelev

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://144.31.219.63:8080
    description: Production server

tags:
  - name: Auth
    description: Аутентификация и авторизация
  - name: Users
    description: Управление пользователями
  - name: Virtual Machines
    description: Управление виртуальными машинами
  - name: Snapshots
    description: Снапшоты виртуальных машин
  - name: Drift
    description: Drift detection отчёты
  - name: Deployments
    description: Управление деплоями
  - name: Services
    description: Управление сервисами инфраструктуры
  - name: Projects
    description: Управление проектами
  - name: Monitoring
    description: Мониторинг и метрики
  - name: Audit
    description: Журнал аудита

security:
  - BearerAuth: []

paths:
  # ======================== AUTH ========================
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Аутентификация пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '401':
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Обновить JWT токен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Токен обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '401':
          description: Невалидный refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ======================== USERS ========================
  /api/v1/users:
    post:
      tags: [Users]
      summary: Создать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Пользователь уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Users]
      summary: Список пользователей
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUserResponse'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Получить пользователя по ID
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Users]
      summary: Обновить пользователя
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      summary: Удалить пользователя
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Удалён
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ======================== VIRTUAL MACHINES ========================
  /api/v1/vms:
    post:
      tags: [Virtual Machines]
      summary: Создать виртуальную машину
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVmRequest'
      responses:
        '201':
          description: VM создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmResponse'
        '409':
          description: VM с таким именем уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Virtual Machines]
      summary: Список виртуальных машин
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/VmStatus'
      responses:
        '200':
          description: Список VM
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVmResponse'

  /api/v1/vms/{id}:
    get:
      tags: [Virtual Machines]
      summary: Детали VM
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: VM найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmDetailResponse'
        '404':
          description: Не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Virtual Machines]
      summary: Обновить VM
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVmRequest'
      responses:
        '200':
          description: Обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmResponse'
        '404':
          description: Не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Virtual Machines]
      summary: Удалить VM
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Удалена
        '404':
          description: Не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/vms/{id}/start:
    post:
      tags: [Virtual Machines]
      summary: Запустить VM
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: VM запущена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmResponse'
        '400':
          description: Невозможно запустить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/vms/{id}/stop:
    post:
      tags: [Virtual Machines]
      summary: Остановить VM
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: VM остановлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmResponse'
        '400':
          description: Невозможно остановить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/vms/{id}/metrics:
    get:
      tags: [Virtual Machines]
      summary: Метрики VM
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MetricType'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Метрики
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricResponse'

  # ======================== SNAPSHOTS ========================
  /api/v1/vms/{vmId}/snapshots:
    post:
      tags: [Snapshots]
      summary: Создать снапшот VM
      parameters:
        - $ref: '#/components/parameters/VmIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotRequest'
      responses:
        '201':
          description: Снапшот создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          description: VM не в состоянии для снапшота
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Snapshots]
      summary: Список снапшотов VM
      parameters:
        - $ref: '#/components/parameters/VmIdParam'
      responses:
        '200':
          description: Список снапшотов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotResponse'

  /api/v1/vms/{vmId}/snapshots/{id}:
    get:
      tags: [Snapshots]
      summary: Детали снапшота
      parameters:
        - $ref: '#/components/parameters/VmIdParam'
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Снапшот найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Snapshots]
      summary: Удалить снапшот
      parameters:
        - $ref: '#/components/parameters/VmIdParam'
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Удалён
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/vms/{vmId}/snapshots/{id}/restore:
    post:
      tags: [Snapshots]
      summary: Откатить VM к снапшоту
      parameters:
        - $ref: '#/components/parameters/VmIdParam'
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Откат выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmResponse'
        '400':
          description: Невозможно откатить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ======================== DRIFT ========================
  /api/v1/vms/{vmId}/drift:
    post:
      tags: [Drift]
      summary: Запустить проверку drift для VM
      parameters:
        - $ref: '#/components/parameters/VmIdParam'
      responses:
        '201':
          description: Проверка запущена, отчёт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftReportResponse'
        '404':
          description: VM не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/drift-reports:
    get:
      tags: [Drift]
      summary: Все drift-отчёты
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DriftStatus'
        - name: vmId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список отчётов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDriftReportResponse'

  /api/v1/drift-reports/{id}:
    get:
      tags: [Drift]
      summary: Детали drift-отчёта
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Отчёт найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriftReportResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ======================== DEPLOYMENTS ========================
  /api/v1/deployments:
    post:
      tags: [Deployments]
      summary: Создать деплой
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '201':
          description: Деплой создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400':
          description: Невалидные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Deployments]
      summary: Список деплоев
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DeploymentStatus'
        - name: vmId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список деплоев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDeploymentResponse'

  /api/v1/deployments/{id}:
    get:
      tags: [Deployments]
      summary: Детали деплоя
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Деплой найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Deployments]
      summary: Удалить деплой
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Удалён
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/deployments/{id}/rollback:
    post:
      tags: [Deployments]
      summary: Откатить деплой
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Откат выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400':
          description: Невозможно откатить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ======================== SERVICES ========================
  /api/v1/services:
    post:
      tags: [Services]
      summary: Создать сервис
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201':
          description: Сервис создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '409':
          description: Сервис уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Services]
      summary: Список сервисов
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ServiceType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ServiceStatus'
      responses:
        '200':
          description: Список сервисов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageServiceResponse'

  /api/v1/services/{id}:
    get:
      tags: [Services]
      summary: Детали сервиса
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Сервис найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Services]
      summary: Обновить сервис
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceRequest'
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Services]
      summary: Удалить сервис
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Удалён
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ======================== PROJECTS ========================
  /api/v1/projects:
    post:
      tags: [Projects]
      summary: Создать проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Проект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '409':
          description: Проект с таким именем существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Projects]
      summary: Список проектов
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProjectResponse'

  /api/v1/projects/{id}:
    get:
      tags: [Projects]
      summary: Детали проекта
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Проект найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Projects]
      summary: Обновить проект
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Projects]
      summary: Удалить проект
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Удалён
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/vms:
    post:
      tags: [Projects]
      summary: Привязать VM к проекту
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachVmRequest'
      responses:
        '200':
          description: VM привязана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          description: Проект или VM не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/vms/{vmId}:
    delete:
      tags: [Projects]
      summary: Отвязать VM от проекта
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - $ref: '#/components/parameters/VmIdParam'
      responses:
        '204':
          description: VM отвязана
        '404':
          description: Не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ======================== MONITORING ========================
  /api/v1/monitoring/metrics:
    get:
      tags: [Monitoring]
      summary: Все метрики с фильтрами
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: vmId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MetricType'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Метрики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageMetricResponse'

  /api/v1/monitoring/health:
    get:
      tags: [Monitoring]
      summary: Health-check всех сервисов
      responses:
        '200':
          description: Статус сервисов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HealthCheckResponse'

  # ======================== AUDIT ========================
  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: Журнал аудита
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: entityType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Список записей аудита
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageAuditLogResponse'

# ================================================================
# COMPONENTS
# ================================================================
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    VmIdParam:
      name: vmId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0

    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  schemas:
    # ======================== ENUMS ========================
    UserRole:
      type: string
      enum: [ADMIN, OPERATOR, VIEWER]

    VmStatus:
      type: string
      enum: [CREATING, RUNNING, STOPPED, ERROR]

    DeploymentStatus:
      type: string
      enum: [PENDING, DEPLOYING, ACTIVE, FAILED, ROLLED_BACK]

    MetricType:
      type: string
      enum: [CPU, MEMORY, DISK, NETWORK]

    ServiceType:
      type: string
      enum: [MONITORING, DATABASE, APPLICATION, SYSTEM]

    ServiceStatus:
      type: string
      enum: [RUNNING, STOPPED, ERROR]

    SnapshotStatus:
      type: string
      enum: [CREATING, READY, RESTORING, FAILED]

    DriftStatus:
      type: string
      enum: [CLEAN, DRIFTED, UNKNOWN]

    AuditAction:
      type: string
      enum: [CREATE, UPDATE, DELETE, START, STOP, DEPLOY, SNAPSHOT, ROLLBACK]

    # ======================== AUTH ========================
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: admin
        password:
          type: string
          minLength: 6
          example: password123

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    JwtResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Время жизни access token в секундах
          example: 3600

    # ======================== USER ========================
    CreateUserRequest:
      type: object
      required: [username, email, password, role]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: operator1
        email:
          type: string
          format: email
          example: operator1@example.com
        password:
          type: string
          minLength: 6
          example: securePass123
        role:
          $ref: '#/components/schemas/UserRole'

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ======================== VIRTUAL MACHINE ========================
    CreateVmRequest:
      type: object
      required: [name, vcpu, memoryMb, diskSizeGb, osImage]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: vm1
        hostname:
          type: string
          maxLength: 100
          example: vm1
        vcpu:
          type: integer
          minimum: 1
          maximum: 16
          example: 1
        memoryMb:
          type: integer
          minimum: 512
          maximum: 32768
          example: 1024
        diskSizeGb:
          type: integer
          minimum: 5
          maximum: 500
          example: 10
        osImage:
          type: string
          example: ubuntu-22.04

    UpdateVmRequest:
      type: object
      properties:
        hostname:
          type: string
        vcpu:
          type: integer
          minimum: 1
          maximum: 16
        memoryMb:
          type: integer
          minimum: 512
          maximum: 32768

    VmResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
        ipAddress:
          type: string
        vcpu:
          type: integer
        memoryMb:
          type: integer
        diskSizeGb:
          type: integer
        osImage:
          type: string
        status:
          $ref: '#/components/schemas/VmStatus'
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VmDetailResponse:
      allOf:
        - $ref: '#/components/schemas/VmResponse'
        - type: object
          properties:
            deployments:
              type: array
              items:
                $ref: '#/components/schemas/DeploymentResponse'
            services:
              type: array
              items:
                $ref: '#/components/schemas/ServiceResponse'
            snapshots:
              type: array
              items:
                $ref: '#/components/schemas/SnapshotResponse'
            latestDrift:
              $ref: '#/components/schemas/DriftReportResponse'

    # ======================== DEPLOYMENT ========================
    CreateDeploymentRequest:
      type: object
      required: [name, image, vmId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: nginx-app
        version:
          type: string
          example: v1.0.0
        image:
          type: string
          example: nginx:latest
        replicas:
          type: integer
          minimum: 1
          default: 1
          example: 2
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 80
        vmId:
          type: string
          format: uuid

    DeploymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        image:
          type: string
        replicas:
          type: integer
        port:
          type: integer
        status:
          $ref: '#/components/schemas/DeploymentStatus'
        vmId:
          type: string
          format: uuid
        deployedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ======================== SNAPSHOT ========================
    CreateSnapshotRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: before-upgrade
        description:
          type: string
          maxLength: 500
          example: Снапшот перед обновлением ОС

    SnapshotResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/SnapshotStatus'
        vmId:
          type: string
          format: uuid
        sizeBytes:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time

    # ======================== DRIFT ========================
    DriftReportResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vmId:
          type: string
          format: uuid
        vmName:
          type: string
        status:
          $ref: '#/components/schemas/DriftStatus'
        expectedState:
          type: object
          description: JSON ожидаемого состояния из OpenTofu state
          additionalProperties: true
        actualState:
          type: object
          description: JSON фактического состояния VM
          additionalProperties: true
        differences:
          type: array
          description: Список отличий
          items:
            $ref: '#/components/schemas/DriftDifference'
        checkedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    DriftDifference:
      type: object
      properties:
        field:
          type: string
          example: memoryMb
        expected:
          type: string
          example: "1024"
        actual:
          type: string
          example: "2048"

    # ======================== SERVICE ========================
    CreateServiceRequest:
      type: object
      required: [name, serviceType, vmId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: prometheus
        description:
          type: string
          maxLength: 500
          example: Мониторинг метрик
        serviceType:
          $ref: '#/components/schemas/ServiceType'
        url:
          type: string
          format: uri
          example: http://192.168.122.103:9090
        vmId:
          type: string
          format: uuid

    UpdateServiceRequest:
      type: object
      properties:
        description:
          type: string
        url:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/ServiceStatus'

    ServiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        serviceType:
          $ref: '#/components/schemas/ServiceType'
        status:
          $ref: '#/components/schemas/ServiceStatus'
        url:
          type: string
        vmId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ======================== PROJECT ========================
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: diploma-project
        description:
          type: string
          maxLength: 500
          example: Дипломный проект по автоматизации инфраструктуры

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500

    AttachVmRequest:
      type: object
      required: [vmId]
      properties:
        vmId:
          type: string
          format: uuid

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
          format: uuid
        vms:
          type: array
          items:
            $ref: '#/components/schemas/VmResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ======================== MONITORING ========================
    MetricResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vmId:
          type: string
          format: uuid
        vmName:
          type: string
        metricType:
          $ref: '#/components/schemas/MetricType'
        value:
          type: number
          format: double
          example: 45.7
        unit:
          type: string
          example: "%"
        collectedAt:
          type: string
          format: date-time

    HealthCheckResponse:
      type: object
      properties:
        serviceName:
          type: string
          example: prometheus
        serviceType:
          $ref: '#/components/schemas/ServiceType'
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
        url:
          type: string
        responseTimeMs:
          type: integer
          example: 42
        checkedAt:
          type: string
          format: date-time

    # ======================== AUDIT ========================
    AuditLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        username:
          type: string
        action:
          $ref: '#/components/schemas/AuditAction'
        entityType:
          type: string
          example: VirtualMachine
        entityId:
          type: string
          format: uuid
        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    # ======================== PAGINATION ========================
    PageInfo:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    PageUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageVmResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/VmResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageDeploymentResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageServiceResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ServiceResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageProjectResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProjectResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageMetricResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MetricResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageDriftReportResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/DriftReportResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    PageAuditLogResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogResponse'
        page:
          $ref: '#/components/schemas/PageInfo'

    # ======================== ERROR ========================
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Virtual machine with id 123 not found
        path:
          type: string
          example: /api/v1/vms/123